name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build
      - run: |
          [ -d android ] || npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#131722' --iconBackgroundColorDark '#131722' --splashBackgroundColor '#131722' --splashBackgroundColorDark '#131722'
          npx cap sync android
          sed -i "s/versionName \"1.0\"/versionName \"$(node -p "require('./package.json').version")\"/" android/app/build.gradle
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk KingOfTrade-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KingOfTrade-debug.apk
          path: KingOfTrade-debug.apk
