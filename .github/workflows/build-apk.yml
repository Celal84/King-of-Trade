name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build
      - run: |
          [ -d android ] || npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#131722' --iconBackgroundColorDark '#131722' --splashBackgroundColor '#131722' --splashBackgroundColorDark '#131722'
          npx cap sync android
          sed -i "s/versionName \"1.0\"/versionName \"$(node -p "require('./package.json').version")\"/" android/app/build.gradle
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - id: ver
        run: |
          NAME="KingOfTrade_v$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$NAME" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk KingOfTrade-debug.apk
          cp KingOfTrade-debug.apk "$NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KingOfTrade-debug.apk
          path: KingOfTrade-debug.apk
      - if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
